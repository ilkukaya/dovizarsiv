name: Doküman doğrulama (geçici)

# Geliştirme ortamının erişemediği resmî dokümanları (Google AdSense/CMP) çekip loga basar. Ölçüm aracıdır; işi bitince silinir.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: AdSense kod ve yerleşim sayfaları
        run: |
          show() {
            echo "================ $1"
            curl -sL -m 40 -A 'Mozilla/5.0' -o /tmp/p.html "$1"
            python3 - <<'PY'
          import re, html
          t = open('/tmp/p.html', encoding='utf-8', errors='ignore').read()
          m = re.search(r'<title>(.*?)</title>', t, re.S)
          print('TITLE:', html.unescape(m.group(1).strip()) if m else '-')
          t = re.sub(r'<(script|style|noscript)[^>]*>.*?</\1>', ' ', t, flags=re.S)
          t = re.sub(r'<(br|/p|/li|/h\d|/tr|/div|/pre|/code)[^>]*>', '\n', t)
          t = re.sub(r'<[^>]+>', ' ', t)
          t = html.unescape(t)
          lines = [re.sub(r'\s+', ' ', l).strip() for l in t.split('\n')]
          lines = [l for l in lines if len(l) > 3]
          start = next((i for i, l in enumerate(lines) if 'Notification' in l or 'Stay organized' in l), 0)
          print('\n'.join(lines[start:start + 75]))
          PY
          }
          show https://support.google.com/adsense/answer/9274019
          show https://support.google.com/adsense/answer/9190028
          show https://support.google.com/fundingchoices/answer/9180084
          echo "================ Publisher policies: yerleşim kuralları"
          curl -sL -m 40 -A 'Mozilla/5.0' -o /tmp/pp.html https://support.google.com/adsense/answer/10502938
          python3 - <<'PY'
          import re, html
          t = open('/tmp/pp.html', encoding='utf-8', errors='ignore').read()
          t = re.sub(r'<(script|style|noscript)[^>]*>.*?</\1>', ' ', t, flags=re.S)
          t = re.sub(r'<(br|/p|/li|/h\d|/tr|/div)[^>]*>', '\n', t)
          t = re.sub(r'<[^>]+>', ' ', t)
          t = html.unescape(t)
          lines = [re.sub(r'\s+', ' ', l).strip() for l in t.split('\n')]
          for l in lines:
              if re.search(r'(?i)navigation|placement|deceptive|misleading|click|interstitial|pop-?up|refresh|consent|EEA|TCF|certified', l) and len(l) > 20:
                  print('-', l[:300])
          PY
