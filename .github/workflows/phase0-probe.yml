name: Faz 0 keşif sondası
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/discovery/**', '.github/workflows/phase0-probe.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Probe
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: node scripts/discovery/phase0-probe.mjs ${{ vars.PROBE_MODE || 'r4' }}
      - name: Belge metinleri
        run: |
          for f in /tmp/DOC_ID_*.bin; do
            [ -f "$f" ] || continue
            echo "==================== TEXT $f ===================="
            file "$f"
            if file "$f" | grep -qi pdf; then pdftotext -layout "$f" - ; else sed -e 's/<[^>]*>/ /g' "$f" | tr -s ' \n' | head -c 30000; fi
          done
