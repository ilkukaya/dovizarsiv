name: Doküman doğrulama (geçici)

# Geliştirme ortamının erişemediği resmî dokümanları (Google AdSense/CMP) çekip loga basar. Ölçüm aracıdır; işi bitince silinir.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: AdSense CSP makalesini bul ve oku
        run: |
          curl -sL -m 40 -A 'Mozilla/5.0' -o /tmp/nav.html https://support.google.com/adsense/answer/9274019
          python3 - <<'PY'
          import re, html
          t = open('/tmp/nav.html', encoding='utf-8', errors='ignore').read()
          links = re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', t, re.S)
          seen = set()
          for href, text in links:
              text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', html.unescape(text))).strip()
              if re.search(r'(?i)content security|privacy|messaging|consent|CMP', text) and (href, text) not in seen:
                  seen.add((href, text))
                  print('LINK:', text[:120], '=>', html.unescape(href)[:200])
          PY
      - name: CSP makalesi
        run: |
          curl -sL -m 40 -A 'Mozilla/5.0' -o /tmp/nav.html https://support.google.com/adsense/answer/9274019
          url=$(python3 - <<'PY'
          import re, html
          t = open('/tmp/nav.html', encoding='utf-8', errors='ignore').read()
          for href, text in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', t, re.S):
              text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', html.unescape(text))).strip()
              if 'Content Security Policy' in text:
                  h = html.unescape(href)
                  print(h if h.startswith('http') else 'https://support.google.com' + h)
                  break
          PY
          )
          echo "URL: $url"
          curl -sL -m 40 -A 'Mozilla/5.0' -o /tmp/csp.html "$url"
          python3 - <<'PY'
          import re, html
          t = open('/tmp/csp.html', encoding='utf-8', errors='ignore').read()
          m = re.search(r'<title>(.*?)</title>', t, re.S)
          print('TITLE:', html.unescape(m.group(1).strip()) if m else '-')
          t = re.sub(r'<(script|style|noscript)[^>]*>.*?</\1>', ' ', t, flags=re.S)
          t = re.sub(r'<(br|/p|/li|/h\d|/tr|/div|/pre|/code)[^>]*>', '\n', t)
          t = re.sub(r'<[^>]+>', ' ', t)
          t = html.unescape(t)
          lines = [re.sub(r'\s+', ' ', l).strip() for l in t.split('\n')]
          lines = [l for l in lines if len(l) > 3]
          start = next((i for i, l in enumerate(lines) if 'Code implementation guide' in l), 0)
          print('\n'.join(lines[start:start + 60]))
          PY
