name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Birim testleri
        run: npm test
      - name: Veri doğrulaması
        if: hashFiles('data/normalized/*.json') != ''
        run: npm run data:validate -- --allow-stale

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Site derlemesi + build guard + seo:validate + links:check
        run: npm run build
